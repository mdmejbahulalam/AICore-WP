name: Release package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build admin assets
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Verify compiled admin assets
        run: npm run verify:release-assets

      - name: Build production plugin zip
        run: npm run package

      - name: Assert manifest is inside final zip
        run: zipinfo -1 build/aicore-wp.zip | grep -qx 'aicore-wp/assets/admin/dist/.vite/manifest.json'

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: aicore-wp
          path: build/aicore-wp.zip
